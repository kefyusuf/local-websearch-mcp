name: Security Remediation

on:
  push:
    branches: [fix/security-dependency-debt]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  refresh-lockfile:
    # One-shot workflow for this remediation branch. Bot commits do not recurse.
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/security-dependency-debt

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply non-breaking npm audit fixes to lockfile
        run: npm audit fix --package-lock-only

      - name: Show remaining audit findings
        run: npm audit --audit-level=moderate || true

      - name: Commit refreshed lockfile
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "No lockfile changes produced."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "fix: refresh vulnerable transitive dependencies"
          git push origin HEAD:fix/security-dependency-debt
