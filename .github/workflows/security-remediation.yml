name: Security Remediation

on:
  push:
    branches: [fix/security-dependency-debt]
    paths: [package.json]

permissions:
  contents: write

jobs:
  refresh-lockfile:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/security-dependency-debt

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Refresh lockfile from package manifest
        run: npm install --package-lock-only --ignore-scripts

      - name: Show remaining audit findings
        run: npm audit --audit-level=moderate || true

      - name: Commit refreshed lockfile
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "No lockfile changes produced."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "fix: refresh dependency lockfile"
          git push origin HEAD:fix/security-dependency-debt
